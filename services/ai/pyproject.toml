[project]
name = "qubedu-ai"
version = "2.0.0"
description = "Qubedu AI engine: math solving, grounded retrieval, essay grading, document extraction and an optional Claude-backed assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sympy>=1.13",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
