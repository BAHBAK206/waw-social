<!doctype html>
<html lang="ar" dir="rtl" data-design="classic" data-theme="light" data-skin="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Qubedu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Qubedu — منصة تعليمية في مكان واحد: أسئلة واختبارات، مجموعات ومحادثات، فصول مباشرة، مخطط للمذاكرة، ومساعد ذكي." />
    <meta property="og:title" content="Qubedu — تعلّم · أنشئ · تواصل" />
    <meta property="og:description" content="مساحة واحدة للتعلّم والإبداع والتواصل، بتجربة تناسبك." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qubedu" />
    <meta property="og:image" content="/brand/qubedu-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/qubedu-og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/brand/qubedu-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Qubedu — تعلّم · أنشئ · تواصل</title>
    <script>
      // Apply the saved appearance before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('qubedu:appearance') || '{}');
          var d = document.documentElement;
          var dark = a.theme === 'dark' || (a.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          d.dataset.theme = dark ? 'dark' : 'light';
          if (a.design) d.dataset.design = a.design;
          if (a.skin) d.dataset.skin = a.skin;
          if (a.language) {
            d.lang = a.language;
            d.dir = a.language === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Qubedu needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
