name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  js:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/qubedu_test
          REDIS_URL: redis://localhost:6379
      - run: pnpm --filter @qubedu/web build
      - run: pnpm --filter @qubedu/api build
      - name: Mobile bundle (Android + iOS)
        run: pnpm --filter @qubedu/mobile export
        env: { EXPO_NO_TELEMETRY: '1', EXPO_OFFLINE: '1' }

  realtime:
    name: Realtime hub (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/realtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/realtime/go.mod, cache-dependency-path: services/realtime/go.sum }
      - run: go vet ./...
      - run: go test -race ./...

  ai:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/ai/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [js, realtime]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: qubedu }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: services/realtime/go.mod, cache-dependency-path: services/realtime/go.sum }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qubedu/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @qubedu/e2e test
        env:
          E2E_START: '1'
          DATABASE_URL: postgres://postgres@localhost:5432/qubedu
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_DISABLED: 'true'
          NO_LOCAL_SERVICES: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [js]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f services/api/Dockerfile -t qubedu-api .
      - run: docker build -f apps/web/Dockerfile -t qubedu-web .
      - run: docker build -t qubedu-realtime services/realtime
      - run: docker build -t qubedu-ai services/ai
